name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Run pipeline from snapshot (analyze, forecast, detect, report, test)
        run: make all

      - name: Upload outputs and charts
        uses: actions/upload-artifact@v4
        with:
          name: outputs-and-charts
          path: |
            output/
            charts/
